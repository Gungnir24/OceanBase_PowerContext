<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>研栖 ResearchNest · 越用越懂你的科研阅读助手</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">研</div>
      <div>
        <div class="brand-name">研栖</div>
        <div class="brand-sub">ResearchNest</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-route="overview" class="active" title="概览">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
        <span>概览</span>
      </button>
      <button data-route="library" title="文献库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/></svg>
        <span>文献库</span>
      </button>
      <button data-route="ask" title="检索问答">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span>检索问答</span>
      </button>
      <button data-route="memory" title="研究记忆">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5 3 3 0 0 0 2 5v1a3 3 0 0 0 3 3"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 5 3 3 0 0 1-2 5v1a3 3 0 0 1-3 3"/><path d="M9 4v16M15 4v16"/></svg>
        <span>研究记忆</span>
      </button>
      <button data-route="weekly" title="组会周报">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5M9 8h3"/></svg>
        <span>组会周报</span>
      </button>
      <button data-route="verify" title="技术核验">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="7" cy="6" r="1.2" fill="currentColor"/><circle cx="7" cy="12" r="1.2" fill="currentColor"/><circle cx="7" cy="18" r="1.2" fill="currentColor"/></svg>
        <span>技术核验</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <b>seekdb</b> 文献与混合检索<br />
      <b>PowerContext</b> 记忆与上下文<br />
      <span id="scope-mini"></span>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="page-title" id="page-title">概览<small>文献找得到，上下文丢不了</small></div>
      <div class="status" id="status-pills"></div>
    </header>
    <div id="demo-banner"></div>
    <div id="view"><div class="skeleton">正在加载…</div></div>
  </main>
</div>

<div id="toast"></div>

<div class="modal hidden" id="modal">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
