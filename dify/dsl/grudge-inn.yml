    - data:
        answer: |
          {{#code_parse.reply#}}

          ---
          📒 第 {{#code_parse.count_new#}} 笔账 ｜ 记仇值 {{#code_parse.grudge_new#}}/100 ｜ 心情：{{#code_parse.mood#}}
        desc: 输出老陈的台词，并在末尾亮出账本状态，让"记忆"这件事看得见。
        selected: false
