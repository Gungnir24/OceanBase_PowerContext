services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    container_name: stepfun-seekdb
    ports:
      - "2881:2881"
    volumes:
      - seekdb_data:/var/lib/seekdb
    environment:
      - REPORTER=docker-seekdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  seekdb_data:
